name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run unit & integration tests
        run: go test -v -race -coverprofile=coverage.out ./pkg/...

      - name: Run benchmarks
        run: go test -bench=. -benchmem ./benchmark/...

      - name: Build standalone binaries
        run: |
          mkdir -p bin
          go build -v -o bin/pulse-server ./cmd/pulse-server
          go build -v -o bin/pulse-cli ./cmd/pulse-cli
          go build -v -o bin/pulse-worker ./examples/worker
          go build -v -o bin/pulse-producer ./examples/producer
