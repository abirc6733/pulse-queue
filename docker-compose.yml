version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: pulse-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulse-server
    command: ["pulse-server", "--redis=redis:6379", "--port=8080"]
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulse-worker-1
    command: ["pulse-worker", "--redis=redis:6379", "--concurrency=10"]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulse-worker-2
    command: ["pulse-worker", "--redis=redis:6379", "--concurrency=10"]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
